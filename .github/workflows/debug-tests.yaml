# Temporary debug workflow: runs a test subset with --verbose so that a hanging
# test can be identified from the run log (the last test name printed before the
# silence is the one that never finished).
#
# Manual trigger only. Uses the prebuilt development image of commit ce764a1 so
# no image build is needed. Delete this file once the investigation is done.

name: Debug Tests

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Test path or file"
        required: false
        default: "test/functional"
      workers:
        description: "Number of parallel workers"
        required: false
        default: "8"

defaults:
  run:
    working-directory: /danbooru

concurrency:
  group: "debug-tests"
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (verbose)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    container:
      # Development image of the commit under test (built by pipeline.yaml).
      image: ghcr.io/${{ github.repository }}:development-${{ github.sha }}
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock

    env:
      HOME: /root
      RAILS_ENV: test
      PARALLEL_WORKERS: ${{ inputs.workers || '8' }}
      RUBYOPT: -W0
      VIPS_WARNING: 0
      COVERAGE: "0"

      DATABASE_URL: postgresql://danbooru:danbooru@postgres/danbooru
      DANBOORU_SECRET_KEY_BASE: fake-test-key
      DANBOORU_AWS_SQS_ENABLED: false
      DANBOORU_SKIP_EXTRACTOR_TESTS: true

    services:
      postgres:
        image: ghcr.io/danbooru/postgres:18.6
        env:
          POSTGRES_USER: danbooru
          POSTGRES_PASSWORD: danbooru
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql

      sftp:
        image: atmoz/sftp
        command: testuser:testpass:::upload

    steps:
      - name: Prepare database
        run: |
          bin/rails db:test:prepare

      - name: Run tests
        env:
          TEST_PATH: ${{ inputs.test_path || 'test/functional' }}
        run: |
          bin/rails test "$TEST_PATH" --verbose
