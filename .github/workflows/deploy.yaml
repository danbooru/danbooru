# Deploy to testbooru.
#
# Called by pipeline.yaml after the images are built,
# or started by hand from the Actions tab.

name: Deploy

# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#permissions
permissions: read-all

on:
  # https://docs.github.com/en/actions/sharing-automations/reusing-workflows
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idenvironment
    environment: testbooru

    # https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
    concurrency:
      group: deploy-testbooru
      cancel-in-progress: true

    steps:
      # kubectl is preinstalled on GitHub's Ubuntu runners.
      # https://github.com/actions/runner-images/tree/main/images/ubuntu
      - name: Configure Kubectl
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_YAML" > ~/.kube/config
          kubectl config set-context --current --namespace=danbooru
        env:
          KUBECONFIG_YAML: ${{secrets.KUBECONFIG_YAML}}

      - name: Deploy
        run: |
          kubectl rollout restart deploy/downbooru deploy/danbooru-cron deploy/danbooru-jobs deploy/danbooru
          kubectl rollout status deploy/downbooru
          kubectl rollout status deploy/danbooru-cron
          kubectl rollout status deploy/danbooru-jobs
          kubectl rollout status deploy/danbooru