# Tag the commit and push the tag.
#
# Called by pipeline.yaml on the production branch,
# to keep track of what was deployed to production and when.

name: Tag on push

on:
  # https://docs.github.com/en/actions/sharing-automations/reusing-workflows
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${GITHUB_REF_NAME}-$(date -u +'%Y.%m.%d.%H%M%S-utc')"
          git tag -a "$TAG_NAME" -m "deployed ${GITHUB_SHA} on ${GITHUB_REF_NAME}"
          git push origin "$TAG_NAME"
          echo "Created $TAG_NAME"