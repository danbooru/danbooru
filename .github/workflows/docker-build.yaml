# Reusable workflow: build and push the production or the development Docker image,
# or retag it if it already exists.
#
#   production:   tags <sha>, <branch>, and `latest` on master.
#   development:  tags development-<sha>, development-<branch>,
#                 and `development` on the default branch.
#
# If the image for this commit already exists, it's not rebuilt, but simply retagged.
#
# Called by pipeline.yaml, or started by hand from the Actions tab.
#
# https://docs.github.com/en/actions/sharing-automations/reusing-workflows
# https://docs.docker.com/reference/cli/docker/buildx/imagetools/inspect/
# https://docs.docker.com/reference/cli/docker/buildx/imagetools/create/
# https://docs.docker.com/build/ci/github-actions/copy-image-registries/

name: Docker Build

on:
  workflow_call:
    inputs:
      docker-target:
        description: "Image to build: 'production' or 'development'"
        type: string
        required: true

  workflow_dispatch:
    inputs:
      docker-target:
        type: choice
        description: "Image to build"
        required: true
        options:
          - production
          - development
      force_build:
        type: boolean
        description: "Build the image even if the image for this commit already exists in the registry"
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

# Needed for a manual run. When called by pipeline.yaml, pipeline.yaml gives the same permissions.
# https://docs.github.com/en/actions/reference/authentication-in-a-workflow#permissions-for-the-github_token
permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERIO_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && 'docker.io/evazion/danbooru' || '' }}
      # A separate package for the build cache, so it's not published under the same package as real images.
      GHCR_BUILDCACHE_IMAGE: ghcr.io/${{ github.repository }}-buildcache
      TAG_PREFIX: ${{ inputs.docker-target == 'development' && 'development-' || '' }}
      CACHE_TAG: ${{ inputs.docker-target == 'development' && 'buildcache-development' || 'buildcache' }}
    steps:
      # https://github.com/docker/setup-qemu-action
      # https://github.com/docker/setup-buildx-action#with-qemu
      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v1
      #  with:
      #    platforms: arm64

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
          # ubuntu-latest on public repositories has 4 vCPU
          buildkitd-config-inline: |
            [worker.oci]
            max-parallelism = 4

      # https://github.com/docker/login-action
      # https://github.com/docker/build-push-action/blob/master/docs/advanced/push-multi-registries.md
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to DockerHub
        if: env.DOCKERIO_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate Docker tags from the commit and the branch.
      # https://github.com/docker/metadata-action
      - name: Generate Docker tags
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERIO_IMAGE }}
          tags: |
            type=sha,format=long,prefix=${{ env.TAG_PREFIX }}
            type=ref,event=branch,prefix=${{ env.TAG_PREFIX }}
            type=raw,value=development,enable=${{ inputs.docker-target == 'development' && github.ref_name == github.event.repository.default_branch }}
          # Tag `latest` on every commit pushed to master, for the production image only.
          # https://github.com/docker/metadata-action/issues/112
          flavor: |
            latest=${{ inputs.docker-target == 'production' && github.ref == 'refs/heads/master' }}
          # Use the commit as the image version, so a retagged image has the correct version on every branch.
          labels: |
            org.opencontainers.image.version=${{ github.sha }}

      - name: Check for existing image
        id: existing
        env:
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -euo pipefail

          existing_image="$GHCR_IMAGE:$TAG_PREFIX$GITHUB_SHA"
          echo "image=$existing_image" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_BUILD:-false}" = "true" ]; then
            echo "Forced build requested. Building."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$existing_image" > /dev/null 2>&1; then
            echo "$existing_image already exists. Retagging."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$existing_image does not exist. Building."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag existing image
        if: steps.existing.outputs.exists == 'true'
        env:
          EXISTING_IMAGE: ${{ steps.existing.outputs.image }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"

          echo "Retagging $EXISTING_IMAGE as:"
          echo "$TAGS"
          docker buildx imagetools create "${args[@]}" "$EXISTING_IMAGE"

      # https://github.com/docker/build-push-action
      - name: Build image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          push: true
          target: ${{ inputs.docker-target }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          #platforms: linux/amd64,linux/arm64
          platforms: linux/amd64

          # https://github.com/docker/build-push-action/blob/master/docs/advanced/cache.md#registry-cache
          # https://dev.to/pst418/speed-up-multi-stage-docker-builds-in-ci-cd-with-buildkit-s-registry-cache-11gi
          # Read both caches. The development image is built on top of the production stages.
          cache-from: |
            type=registry,ref=${{ env.GHCR_BUILDCACHE_IMAGE }}:buildcache
            type=registry,ref=${{ env.GHCR_BUILDCACHE_IMAGE }}:buildcache-development
          cache-to: type=registry,ref=${{ env.GHCR_BUILDCACHE_IMAGE }}:${{ env.CACHE_TAG }},mode=max

          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
          # ubuntu-latest on public repositories has 4 vCPU
          build-args: |
            JOBS=4
            DOCKER_IMAGE_REVISION=${{ github.sha }}
            DOCKER_IMAGE_BUILD_DATE=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}

      # https://github.com/marketplace/actions/debugging-with-ssh
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && inputs.debug_enabled) }}
        with:
          limit-access-to-actor: true